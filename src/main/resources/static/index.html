<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LUXE SKIN | Curated Care</title>
    <link rel="icon" type="image/png" href="luxeSkin.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>
<header>
    <h1>LUXE SKIN</h1>
    <p class="subtitle">Personalized Dermatological Solutions</p>
    <div class="search-container">
        <select id="skinTypeSelector">
            <option value="">Select Your Skin Type</option>
            <option value="Oily">Oily</option>
            <option value="Dry">Dry</option>
            <option value="Sensitive">Sensitive</option>
            <option value="Combination">Combination</option>
        </select>
        <button onclick="fetchProducts()">Discover</button>
    </div>
</header>

<main id="productGrid" class="grid"></main>

<!-- The Luxury Modal -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close-button" onclick="closeModal()">&times;</span>
        <div id="modalBody" class="modal-layout"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
